name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: AtlasReaper311/atlas-infra/.github/workflows/deploy-worker.yml@6c3cb66b1c1c7af0d887811991c6ca8a4d65371e # atlas-infra explicit top-level production targeting
    with:
      worker_name: specular-sonify
      run_tests: true
      require_meta: true
      wrangler_version: "4.112.0"
    secrets: inherit
