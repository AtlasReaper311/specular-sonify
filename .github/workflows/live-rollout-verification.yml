name: Live System Symphony rollout verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-live-rollout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contracts:
    name: API has DORA and twenty-two services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify /sonify and /sonify/_meta
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const origin = "https://atlas-systems.uk";
          async function read(url) {
            const response = await fetch(url, {
              headers: { accept: "application/json", origin },
              cache: "no-store",
              signal: AbortSignal.timeout(20_000),
            });
            assert.equal(response.status, 200, `${url} answered ${response.status}`);
            assert.equal(response.headers.get("access-control-allow-origin"), origin, `${url} does not allow ${origin}`);
            return response.json();
          }

          const sonify = await read("https://api.atlas-systems.uk/sonify");
          assert.ok(Array.isArray(sonify.services), "/sonify services array missing");
          assert.equal(sonify.services.length, 22, `/sonify returned ${sonify.services.length} services`);
          assert.ok(sonify.services.some((service) => service?.name === "atlas-dora"), "atlas-dora missing from /sonify");
          assert.ok(sonify.services.some((service) => service?.name === "specular-sonify"), "specular-sonify missing from /sonify");
          assert.ok(sonify.services.every((service) => !String(service?.evidence_source ?? "").startsWith("preview:")), "preview evidence leaked into production /sonify");

          const meta = await read("https://api.atlas-systems.uk/sonify/_meta");
          assert.ok(JSON.stringify(meta).toLowerCase().includes("twenty-two"), "/sonify/_meta does not advertise twenty-two services");

          console.log(JSON.stringify({
            serviceCount: sonify.services.length,
            atlasDoraPresent: true,
            specularSonifyPresent: true,
            metaAdvertisesTwentyTwo: true,
          }, null, 2));
          NODE

  observability:
    name: Observability shows thirteen covered
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install pinned browser tooling
        run: npm install --no-save --no-package-lock playwright@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify live Observability join
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          page.on("pageerror", (error) => errors.push(error.message));
          try {
            const response = await page.goto("https://atlas-systems.uk/systems/observability/", {
              waitUntil: "domcontentloaded",
              timeout: 60_000,
            });
            assert.ok(response?.ok(), `Observability answered ${response?.status() ?? "no response"}`);
            await page.waitForFunction(() => (
              document.querySelector("#summary-services")?.textContent?.trim() === "13 covered"
            ), null, { timeout: 60_000 });
            const state = await page.evaluate(() => ({
              covered: document.querySelector("#summary-services")?.textContent?.trim() ?? null,
              status: document.querySelector("#registry-status")?.textContent?.trim() ?? null,
            }));
            assert.equal(state.covered, "13 covered", JSON.stringify(state, null, 2));
            assert.equal(errors.length, 0, errors.join("\n"));
            console.log(JSON.stringify(state, null, 2));
          } finally {
            await browser.close();
          }
          NODE

  system-symphony:
    name: System Symphony starts with live data and samples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install pinned browser tooling
        run: npm install --no-save --no-package-lock playwright@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify approved live instrument
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const browser = await chromium.launch({
            headless: true,
            args: ["--autoplay-policy=no-user-gesture-required"],
          });
          const page = await browser.newPage();
          const pageErrors = [];
          const requestFailures = [];
          page.on("pageerror", (error) => pageErrors.push(error.message));
          page.on("requestfailed", (request) => {
            const url = request.url();
            if (
              url.startsWith("https://api.atlas-systems.uk/")
              || url.includes("/vendor/tone.min.js")
              || url.includes("/static/audio/system-symphony/")
            ) {
              requestFailures.push({ url, error: request.failure()?.errorText ?? "unknown" });
            }
          });

          try {
            const response = await page.goto("https://atlas-systems.uk/lab/system-symphony/?symphonyDebug=1", {
              waitUntil: "domcontentloaded",
              timeout: 60_000,
            });
            assert.ok(response?.ok(), `System Symphony answered ${response?.status() ?? "no response"}`);
            await page.waitForFunction(() => Boolean(window.Tone) && Boolean(window.__symphonyEngine), null, { timeout: 30_000 });

            const button = page.locator("[data-audio-toggle]:visible").first();
            await button.waitFor({ state: "visible", timeout: 30_000 });
            await button.click();
            await page.waitForFunction(() => (
              [...document.querySelectorAll("[data-audio-toggle]")].some((node) => (
                node.getAttribute("aria-pressed") === "true" && /stop/i.test(node.textContent ?? "")
              ))
            ), null, { timeout: 45_000 });
            await page.waitForFunction(() => window.__symphonyEngine?.isSampleReady?.() === true, null, { timeout: 45_000 });
            await page.waitForFunction(() => window.__symphonyEngine?.getSampleLoadStats?.()?.backgroundComplete === true, null, { timeout: 90_000 });

            const state = await page.evaluate(() => ({
              toneAvailable: Boolean(window.Tone),
              toneContextState: window.Tone?.getContext?.()?.rawContext?.state
                ?? window.Tone?.context?.rawContext?.state
                ?? window.Tone?.context?.state
                ?? null,
              source: document.getElementById("system-symphony-widget")?.dataset?.source ?? null,
              hostState: document.getElementById("system-symphony-widget")?.dataset?.state ?? null,
              sampleReady: window.__symphonyEngine?.isSampleReady?.() ?? false,
              sampleStats: window.__symphonyEngine?.getSampleLoadStats?.() ?? null,
              status: document.querySelector("[data-important-status]")?.textContent?.trim() ?? null,
            }));

            assert.equal(state.source, "live", JSON.stringify(state, null, 2));
            assert.equal(state.sampleReady, true, JSON.stringify(state, null, 2));
            assert.equal(state.sampleStats?.failed, 0, JSON.stringify(state, null, 2));
            assert.equal(state.sampleStats?.loaded, state.sampleStats?.totalAssets, JSON.stringify(state, null, 2));
            assert.equal(pageErrors.length, 0, pageErrors.join("\n"));
            assert.equal(requestFailures.length, 0, JSON.stringify(requestFailures, null, 2));
            console.log(JSON.stringify({ state, pageErrors, requestFailures }, null, 2));
          } finally {
            await browser.close();
          }
          NODE
