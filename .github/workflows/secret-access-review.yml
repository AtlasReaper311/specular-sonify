name: Deployment secret access review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cloudflare-token:
    name: CF_WORKERS_DEPLOY_TOKEN available
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only
        env:
          VALUE: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
        run: test -n "$VALUE"

  cloudflare-account:
    name: CF_ACCOUNT_ID available
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only
        env:
          VALUE: ${{ secrets.CF_ACCOUNT_ID }}
        run: test -n "$VALUE"

  deployment-webhook:
    name: DISCORD_API_DEPLOYS_WEBHOOK available
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only
        env:
          VALUE: ${{ secrets.DISCORD_API_DEPLOYS_WEBHOOK }}
        run: test -n "$VALUE"
